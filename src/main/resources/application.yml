springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:AIzaSyCyzQxgYrfTqwIdpmi49lBDsK5VuLXFawE}
    oauth:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback}
  jwt:
    issuer: driver-service
    access-ttl: 15m
    refresh-ttl: 7d
    # Use a long random value in production; value is hashed to 256 bits for HS256.
    secret: ${JWT_SECRET:mySuperSecretKey123!XYZabcdef987654}
