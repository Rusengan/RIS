databaseChangeLog:
  - changeSet:
      id: 0002-create-vehicles
      author: coursework
      changes:
        - createTable:
            tableName: vehicles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plate_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: brand
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: capacity_kg
                  type: INTEGER
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: vehicles
            indexName: idx_vehicles_status
            columns:
              - column:
                  name: status
