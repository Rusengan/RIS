databaseChangeLog:
  - changeSet:
      id: 0006-init-audit-logs
      author: coursework
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: action
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: BIGINT
              - column:
                  name: payload_json
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: audit_logs
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_logs_user
        - sql:
            sql: CREATE INDEX idx_audit_created_desc ON audit_logs (created_at DESC)
        - createIndex:
            indexName: idx_audit_user
            tableName: audit_logs
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_audit_entity
            tableName: audit_logs
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id
