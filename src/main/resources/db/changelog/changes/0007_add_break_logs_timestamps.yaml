databaseChangeLog:
  - changeSet:
      id: 0007-add-break-logs-timestamps
      author: coursework
      comment: >
        BreakLogEntity declares createdAt/updatedAt as @Column(nullable = false),
        but the original 0004 migration did not create these columns.
        Add them now, backfill existing rows from started_at, then enforce NOT NULL.
      changes:
        - addColumn:
            tableName: break_logs
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
        - sql:
            sql: >
              UPDATE break_logs
              SET created_at = COALESCE(created_at, started_at, now()),
                  updated_at = COALESCE(updated_at, started_at, now())
              WHERE created_at IS NULL OR updated_at IS NULL
        - addNotNullConstraint:
            tableName: break_logs
            columnName: created_at
            columnDataType: TIMESTAMP WITH TIME ZONE
        - addNotNullConstraint:
            tableName: break_logs
            columnName: updated_at
            columnDataType: TIMESTAMP WITH TIME ZONE
